name: Bug report
description: Report a reproducible skill, helper or packaging problem.
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the minimal prompt and actual versus expected behavior. Remove private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host, version and platform
      placeholder: Codex / desktop version / OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and available tools
      description: Steps, source access limits and relevant artifacts. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: Relevant redacted helper or package check output, if applicable.
